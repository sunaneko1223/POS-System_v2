# --------------------------------------------------
# 【商品管理 暗証番号(PIN) 設定ファイル】
# --------------------------------------------------
# 注意事項:
# 1. use_pin を true にすると、商品管理画面を開く時に暗証番号の入力が必要になります。
#    false のままなら、この機能自体が無効(今まで通り誰でもすぐ開けます)。
# 2. pin には好きな暗証番号を文字列で入力してください(数字・文字どちらでも構いません)。
# 3. use_pin: true にする場合は、pin を初期値の "DEFAULT" のままにしないでください。
#
# ご注意:
# このファイルはブラウザから普通に読み込めるファイルです。
# URLを知っていて、本気でファイルの中身を直接見ようとする人までは防げません。
# あくまで「詳しくない人がうっかり商品を消してしまう」ことを防ぐためのものです。
# 本気で第三者からのアクセスを防ぎたい場合は、このリポジトリ自体を非公開(Private)に
# することをおすすめします。
# --------------------------------------------------
use_pin: false
pin: "DEFAULT"
