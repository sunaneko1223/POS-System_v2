# --------------------------------------------------
# 【サーバー連携 設定ファイル】
# --------------------------------------------------
# 注意事項:
# 1. server_url には集計サーバーのURLを入力してください（末尾に "/" は付けない）
# 2. 項目名（server_url）は絶対に変えないでください。
# 3. 項目名のあとの「: 」は必ず「半角コロン＋半角スペース」にしてください。
#
# このファイルは「初期値」です。
# ・複数端末に配布するときは、このファイルを書き換えてから配ると
#   全端末に一括で反映できます。
# ・すでに配ったあとで1台だけ変更したい／オフラインで変更したい／
#   このファイルを直接編集できない、という場合は、
#   アプリ内の「サーバー連携」画面から変更してください。
#   （画面から変更した値はこのファイルより優先されます）
#
# サーバーがまだ無い場合は、下の例のように仮の値のままで構いません。
# --------------------------------------------------
server_url: "https://example.com"
