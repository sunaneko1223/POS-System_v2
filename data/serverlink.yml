# --------------------------------------------------
# 【サーバー連携 設定ファイル】
# --------------------------------------------------
# 注意事項:
# 1. server_url には集計サーバーのURLを入力してください（末尾に "/" は付けない）
# 2. api_key には、サーバー側(config/poslink.yml)に設定したものと同じ文字列を入力してください。
#    これが一致していないと、サーバーへの送信・取得が拒否されます。
# 3. 項目名（server_url, api_key）は絶対に変えないでください。
# 4. 項目名のあとの「: 」は必ず「半角コロン＋半角スペース」にしてください。
#
# このファイルは「初期値」です。
# サーバーがまだ無い場合は、下の例のように仮の値のままで構いません。
# --------------------------------------------------
server_url: "https://example.com"
api_key: "DEFAULT"
