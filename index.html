<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>レジシステム</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./library/tailwind.min.css">

<style>
html, body { height: 100%; overflow: hidden; position: fixed; width: 100%; }
body { font-family: 'Inter', 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.selected-cart { border-color: #3b82f6 !important; background-color: #eff6ff !important; }

/* tailwind.min.cssは事前ビルドの静的CSSで、実際に使ったクラスしか含まれていない。

.btn-lime { background-color: #84cc16; color: #1f2937; }
.btn-lime:hover { background-color: #65a30d; color: #ffffff; }

<body class="bg-gray-100 flex items-center justify-center">
<div class="w-full h-full max-w-4xl mx-auto bg-white shadow-2xl rounded-lg flex flex-col overflow-hidden">

  <!-- ========== 画面1: 商品選択 ========== -->

        <button id="btn-to-server" class="btn-lime text-xs py-2 px-3 rounded-lg font-bold transition">サーバー</button>
        <button id="btn-to-manager" class="bg-purple-500 hover:bg-purple-600 text-xs py-2 px-3 rounded-lg font-bold transition">商品管理</button>

        <h2 class="text-lg font-bold border-b pb-2 mb-4 flex-shrink-0">ご注文内容</h2>
        <div id="cart-items" class="flex-grow space-y-2 overflow-y-auto no-scrollbar min-h-0"></div>
        <div class="mt-3 space-y-2 flex-shrink-0">

<script>
(function() {
'use strict';

// ==================== 音声 ====================
let audioCtx;
function playSound(type = 'click') {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    switch(type) {
      case 'add':    o.type='sine';     o.frequency.setValueAtTime(523.25, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-5, audioCtx.currentTime+.1); break;
      case 'remove': o.type='sine';     o.frequency.setValueAtTime(349.23, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-5, audioCtx.currentTime+.15); break;
      case 'confirm':o.type='triangle'; o.frequency.setValueAtTime(523.25, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(659.25, audioCtx.currentTime+.1); g.gain.exponentialRampToValueAtTime(1e-5, audioCtx.currentTime+.2); break;
      case 'navigate':o.type='sawtooth';o.frequency.setValueAtTime(261.63, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-5, audioCtx.currentTime+.1); break;
      case 'clear':  o.type='sine';     o.frequency.setValueAtTime(196,    audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-5, audioCtx.currentTime+.2); break;
      default:       o.type='sine';     o.frequency.setValueAtTime(440,    audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-5, audioCtx.currentTime+.1);
    }
    o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + .3);
  } catch(e) {}
}

// ==================== ミニコンソールオーバーレイ(トラブル報告用) ====================
// console.log/warn/errorを横取りしてログを溜めておき、
// console.errorが呼ばれた瞬間に自動でオーバーレイをポップアップする。
// 本来のconsoleへの出力は潰さずそのまま行う。
const consoleLogEntries = [];
const originalConsole = {
  log: console.log.bind(console),
  warn: console.warn.bind(console),
  error: console.error.bind(console)
};

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function formatLogArgs(args) {
  return args.map(a => {
    if (a instanceof Error) return `${a.name}: ${a.message}`;
    if (typeof a === 'object' && a !== null) { try { return JSON.stringify(a); } catch(e) { return String(a); } }
    return String(a);
  }).join(' ');
}

function pushLogEntry(level, args) {
  const time = new Date().toLocaleTimeString('ja-JP');
  consoleLogEntries.push({ level, time, message: formatLogArgs(args) });
  if (consoleLogEntries.length > 300) consoleLogEntries.shift(); // 溜まりすぎ防止
  if (consoleOverlayEl && !consoleOverlayEl.classList.contains('hidden')) renderConsoleOverlayList();
}

console.log = (...args) => { pushLogEntry('log', args); originalConsole.log(...args); };
console.warn = (...args) => {
  pushLogEntry('warn', args);
  originalConsole.warn(...args);
  showConsoleOverlay();
};
console.error = (...args) => {
  pushLogEntry('error', args);
  originalConsole.error(...args);
  showConsoleOverlay();
};

window.addEventListener('error', (e) => {
  console.error(`未処理エラー: ${e.message} (${e.filename}:${e.lineno})`);
});
window.addEventListener('unhandledrejection', (e) => {
  console.error(`未処理のPromiseエラー: ${e.reason}`);
});

let consoleOverlayEl = null;
let consoleReopenBtnEl = null;

function buildConsoleOverlay() {
  const overlay = document.createElement('div');
  overlay.id = 'mini-console-overlay';
  overlay.className = 'fixed inset-0 z-50 flex items-end justify-center bg-black/40 hidden';
  overlay.innerHTML = `
    <div class="bg-white w-full max-w-2xl max-h-[70vh] rounded-t-2xl shadow-2xl flex flex-col overflow-hidden">
      <div class="flex justify-between items-center p-4 border-b border-gray-200 bg-gray-800 text-white flex-shrink-0">

function renderConsoleOverlayList() {
  if (!consoleOverlayEl) return;
  const listEl = consoleOverlayEl.querySelector('#mini-console-list');
  const colorMap = { log: 'text-gray-300', warn: 'text-yellow-400', error: 'text-red-400' };
  listEl.innerHTML = consoleLogEntries.map(entry =>
    `<div class="${colorMap[entry.level] || 'text-gray-300'}">[${entry.time}] ${entry.level.toUpperCase()}: ${escapeHtml(entry.message)}</div>`
  ).join('') || '<div class="text-gray-500">ログはまだありません</div>';
  listEl.scrollTop = listEl.scrollHeight;
}

function showConsoleOverlay() {
  if (!consoleOverlayEl) consoleOverlayEl = buildConsoleOverlay();
  renderConsoleOverlayList();
  consoleOverlayEl.classList.remove('hidden');
  updateConsoleReopenButton();
}

function hideConsoleOverlay() {
  if (consoleOverlayEl) consoleOverlayEl.classList.add('hidden');
  updateConsoleReopenButton();
}

function copyConsoleLog() {
  const text = consoleLogEntries.map(e => `[${e.time}] ${e.level.toUpperCase()}: ${e.message}`).join('\n');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('mini-console-copy');
      if (btn) { const original = btn.textContent; btn.textContent = 'コピーしました'; setTimeout(() => { btn.textContent = original; }, 1500); }
    }).catch(() => alert('コピーに失敗しました'));
  } else {
    alert('このブラウザはコピー機能に対応していません');
  }
}

// 閉じたあとも、一度でもエラーが出ていれば右下に小さく再表示ボタンを出す
// (「普段は非表示」を保ちつつ、あとからログを見返せるようにするため)
function updateConsoleReopenButton() {
  const isOverlayOpen = consoleOverlayEl && !consoleOverlayEl.classList.contains('hidden');
  const hasError = consoleLogEntries.some(e => e.level === 'error' || e.level === 'warn');
  if (hasError && !isOverlayOpen) {
    if (!consoleReopenBtnEl) {
      consoleReopenBtnEl = document.createElement('button');
      consoleReopenBtnEl.id = 'mini-console-reopen';
      consoleReopenBtnEl.className = 'fixed bottom-4 right-4 z-40 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 px-3 rounded-full shadow-lg';
      consoleReopenBtnEl.textContent = '⚠ エラーログ';
      consoleReopenBtnEl.addEventListener('click', showConsoleOverlay);

    }

  } else if (consoleReopenBtnEl) {
    consoleReopenBtnEl.classList.add('hidden');

}

// ==================== Dexie (IndexedDB) ====================
// DB名は "POS-System_v2" で固定。今後スキーマを変える必要が出ても、
// DB_NAMEは変えずにDB_VERSIONを上げて対応すること(名前を変えると使わなくなった
// 古いDBが端末に残り続けて分かりにくくなるため)。
// バージョンを上げる際は、db.version(2).stores({...}).upgrade(tx => {...}) のように
// 新しいバージョン定義を追加していく(Dexieの標準的なマイグレーション方法)。
// テーブル構成: products(商品) / history(取引履歴、orderNumberはsettingsのnextOrderNumberを元に採番) / settings(その他設定の入れ物)
const DB_NAME = 'POS-System_v2';
const DB_VERSION = 1;
const db = new Dexie(DB_NAME);
db.version(DB_VERSION).stores({
  products: 'id',
  history: 'orderNumber',
  settings: 'key'
});

async function settingsGet(key) {
  const row = await db.settings.get(key);
  return row ? row.value : undefined;
}

async function settingsSet(key, value) {
  await db.settings.put({ key, value });
}

// ==================== 商品データ ====================
// 商品名は記号・数字だけだと弾く(ひらがな・カタカナ・漢字・英字のいずれかを最低1文字要求)
function isValidProductName(name) {
  return /[a-zA-Zぁ-んァ-ヶ一-龠]/.test(String(name));
}
// 値段は1以上の整数のみ有効
function isValidPrice(price) {
  return Number.isInteger(price) && price > 0;
}

async function saveProducts() {
  // clear→bulkPutを1つのトランザクションにまとめ、
  // 途中で失敗しても商品データが空にならないようにする。
  await db.transaction('rw', db.products, async () => {
    await db.products.clear();
    if (products.length) await db.products.bulkPut(products);
  });
}

async function loadProductsFromYAML() {
  let ymlProducts = null;
  try {
    const res = await fetch('./data/item.yml');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = jsyaml.load(text);
    if (!Array.isArray(parsed)) throw new Error('Not array');
    ymlProducts = parsed.filter(p => {
      if (!(p.id && p['商品名'] && p['値段'] !== undefined)) return false;
      if (!isValidProductName(p['商品名'])) {
        console.warn(`item.yml: 商品「${p['商品名']}」は商品名が不正(記号・数字だけ)なため読み込みませんでした`);
        return false;
      }
      if (!isValidPrice(Number(p['値段']))) {
        console.warn(`item.yml: 商品「${p['商品名']}」は値段が不正(1以上の整数のみ有効)なため読み込みませんでした`);
        return false;
      }
      return true;
    });
  } catch(e) {
    console.warn('item.yml読み込み失敗:', e.message);
  }

  let dbProducts = [];
  try { dbProducts = await db.products.toArray(); } catch(e) {}

  if (ymlProducts) {
    // item.ymlにあるidはyml側の内容を優先(価格変更などを反映)。
    // ymlに無いid(商品管理画面から追加した商品)はDBの内容をそのまま残す。
    const ymlIds = new Set(ymlProducts.map(p => p.id));
    const extraFromDb = dbProducts.filter(p => !ymlIds.has(p.id));
    products = [...ymlProducts, ...extraFromDb];
    await saveProducts();
  } else if (dbProducts.length) {
    // オフライン等でymlが読めない場合はDBの内容をそのまま使用
    products = dbProducts;
  } else {
    products = [];
  }
}

// ==================== 取引履歴データ ====================
async function loadHistory() {
  try {
    posHistory = await db.history.toArray();
    posHistory.sort((a, b) => a.orderNumber - b.orderNumber);
  } catch(e) {
    console.error('履歴読み込みエラー:', e);
    posHistory = [];
  }
}

// 会計データの保存。次の受付番号はsettingsテーブルで管理し、
// db.transaction()で「番号の読み取り→履歴への保存→番号の更新」を1つの操作にまとめる。
// これにより、複数タブで同時に会計しても番号が重複しない(IndexedDBのトランザクションが
// 同じテーブルへの操作を順番に処理してくれるため)のと、途中で失敗した場合に
// 中途半端な状態のまま残らないようにする。
async function saveTransaction(data) {
  return await db.transaction('rw', db.history, db.settings, async () => {
    const current = await db.settings.get('nextOrderNumber');
    const orderNumber = (current && typeof current.value === 'number' && current.value > 0) ? current.value : 1;
    const transaction = { orderNumber, ...data };
    await db.history.add(transaction);
    await db.settings.put({ key: 'nextOrderNumber', value: orderNumber + 1 });
    return transaction;
  });
}

// resetOrderNumberがtrueの時だけ受付番号(と各端末の送信済み状態)もリセットする。
// 履歴削除・番号リセット・送信済み状態の削除を1つのトランザクションにまとめ、
// 途中で他の操作(会計確定など)と競合して中途半端な状態になるのを防ぐ。
async function clearAllHistory(resetOrderNumber) {
  await db.transaction('rw', db.history, db.settings, async () => {
    await db.history.clear();
    if (resetOrderNumber) {
      await db.settings.put({ key: 'nextOrderNumber', value: 1 });
      // 各端末の「前回送信済み番号」もリセットしないと、
      // 受付番号がリセットされた際に「新しいデータがありません」と誤判定されるため
      const allSettings = await db.settings.toArray();
      const staleSyncKeys = allSettings.filter(r => r.key.startsWith('lastSent_')).map(r => r.key);
      if (staleSyncKeys.length) await db.settings.bulkDelete(staleSyncKeys);
    }
  });
  posHistory = [];
}

// ==================== カート ====================
function addToCart(id, 商品名, 値段, 種類) {
  const key = `${id}_${商品名}_${値段}`;
  if (!cart[key]) { cart[key] = { id, 商品名, 値段, 種類: 種類 || null, 数量: 0 }; cartSequence.push(key); }
  cart[key].数量 += 1;
}

function removeFromCart(key) {
  if (!cart[key]) return;
  cart[key].数量 -= 1;
  if (cart[key].数量 <= 0) {
    delete cart[key];
    cartSequence = cartSequence.filter(k => k !== key);
  }
}

function getCartTotal() {
  let total = 0;
  cartSequence.forEach(k => { if (cart[k]) total += cart[k].値段 * cart[k].数量; });
  return total;
}

function updateCartView() {
  const cartEl = document.getElementById('cart-items');
  const totalEl = document.getElementById('total-amount-display');
  const removeBtn = document.getElementById('remove-selected-btn');

  cartEl.innerHTML = '';
  const total = getCartTotal();

  cartSequence.forEach(key => {
    const item = cart[key];
    if (!item) return;
    const div = document.createElement('div');
    div.className = 'bg-white p-3 rounded-lg border-2 border-gray-200 cursor-pointer hover:bg-gray-50 transition';
    div.innerHTML = `
      <div class="flex justify-between items-center text-sm">
        <span class="font-bold">${escapeHtml(item.商品名)}${item.種類 ? `<span class="font-normal text-gray-400">（${escapeHtml(item.種類)}）</span>` : ''}</span>
        <span class="text-gray-500">×${item.数量}</span>
      </div>
      <div class="text-right text-blue-600 font-bold mt-1">¥${item.値段 * item.数量}</div>
    `;
    div.addEventListener('click', () => {
      selectedCartKey = key;
      document.querySelectorAll('#cart-items > div').forEach(el => el.classList.remove('selected-cart'));
      div.classList.add('selected-cart');
      removeBtn.disabled = false;
      playSound('navigate');
    });
    if (selectedCartKey === key) div.classList.add('selected-cart');
    cartEl.appendChild(div);
  });

  totalEl.textContent = `¥${total}`;
  if (!selectedCartKey || !cart[selectedCartKey]) {
    selectedCartKey = null;
    removeBtn.disabled = true;
  }
}

// ==================== おつり計算 ====================
function calcChange(change) {
  const bills = [10000, 5000, 2000, 1000, 500, 100, 50, 10, 5, 1];
  const result = [];
  let rem = change;
  bills.forEach(b => {
    const count = Math.floor(rem / b);
    if (count > 0) { result.push({ bill: b, count }); rem -= b * count; }
  });
  return result;
}

// サーバー連携画面のデータ本体(サーバーから取得した全端末の取引データ、フィルタ前)
let serverTransactions = [];
let searchFilter = { dates: [], timeFrom: '', timeTo: '', device: '' };
let openAccordionTab = null;

// ==================== アコーディオンタブ ====================
function setupAccordionTabs() {
  document.querySelectorAll('.accordion-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      const panelsWrap = document.getElementById('accordion-panels');
      const wasOpen = openAccordionTab === tab;

      document.querySelectorAll('.accordion-panel').forEach(p => p.classList.add('hidden'));
      document.querySelectorAll('.accordion-tab-btn').forEach(b => b.classList.remove('bg-gray-50', 'text-gray-900'));

      if (wasOpen) {
        panelsWrap.classList.add('hidden');
        openAccordionTab = null;
      } else {
        panelsWrap.classList.remove('hidden');
        document.getElementById(`panel-${tab}`).classList.remove('hidden');
        btn.classList.add('bg-gray-50', 'text-gray-900');
        openAccordionTab = tab;
        if (tab === 'ranking') renderProductRanking();
        if (tab === 'search') renderSearchDateTags();
      }
      playSound('navigate');
    });
  });
}

function closeAllAccordionPanels() {
  document.getElementById('accordion-panels').classList.add('hidden');
  document.querySelectorAll('.accordion-panel').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.accordion-tab-btn').forEach(b => b.classList.remove('bg-gray-50', 'text-gray-900'));
  openAccordionTab = null;
}

// ==================== 接続ステータス ====================
function setServerStatus(state) {
  const el = document.getElementById('server-status-badge');
  if (state === 'connected') {
    el.textContent = '● 接続中';
    el.className = 'text-xs font-bold px-2 py-1 rounded-full bg-green-100 text-green-700';
  } else if (state === 'disconnected') {
    el.textContent = '● 未接続';
    el.className = 'text-xs font-bold px-2 py-1 rounded-full bg-red-100 text-red-700';
  } else {
    el.textContent = '確認中';
    el.className = 'text-xs font-bold px-2 py-1 rounded-full bg-gray-600 text-gray-200';
  }
}

// ==================== データ送信 ====================
function updateSendButton() {
  const btn = document.getElementById('send-btn');
  btn.disabled = !selectedDevice;
  btn.textContent = '送信';
}

function showServerStatus(type, message) {
  const el = document.getElementById('status-msg');
  const colorClass = type === 'error' ? 'bg-red-50 text-red-700' : type === 'success' ? 'bg-green-50 text-green-700' : 'bg-blue-50 text-blue-700';
  el.className = `mt-3 p-2 rounded-lg text-xs ${colorClass}`;
  el.textContent = message;
}

function hideServerStatus() {
  document.getElementById('status-msg').className = 'mt-3 p-2 rounded-lg text-xs hidden';
}

async function handleSend() {
  hideServerStatus();
  if (!selectedDevice) { showServerStatus('error', '端末を選択してください'); return; }

  if (!navigator.onLine) {
    showServerStatus('error', '❌ ネットワークに接続されていません。Wi-Fiに接続してから再度お試しください。');
    return;
  }

  const serverUrl = getEffectiveServerUrl();
  if (!serverUrl) {
    showServerStatus('error', 'サーバーURLが設定されていません。data/serverlink.yml を確認してください。');
    return;
  }

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  showServerStatus('info', '送信中...');

  try {
    const lastSentKey = `lastSent_${selectedDevice}`;
    const lastSent = (await settingsGet(lastSentKey)) || 0;

    if (!posHistory.length) {
      showServerStatus('error', '送信できる取引データがありません');
      return;
    }

    const currentMax = Math.max(...posHistory.map(t => t.orderNumber));
    if (currentMax <= lastSent) {
      showServerStatus('error', '新しいデータがありません。前回送信分よりあとの取引がまだ発生していません。');
      return;
    }

    const diff = posHistory.filter(t => t.orderNumber > lastSent);
    const payload = diff.map(t => ({ ...t, deviceName: selectedDevice }));

    const res = await fetch(`${serverUrl}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transactions: payload })
    });

    if (!res.ok) throw new Error(`サーバーエラー (HTTP ${res.status})`);

    const result = await res.json();
    if (!result.ok) throw new Error(result.error || '送信に失敗しました');

    await settingsSet(lastSentKey, currentMax);
    showServerStatus('success', `✅ ${diff.length}件のデータを送信しました（${selectedDevice}）`);
    loadServerData();

  } catch(e) {
    console.error('サーバーへの送信に失敗しました:', e);
    showServerStatus('error', `❌ 送信に失敗しました: ${e.message}`);
  } finally {
    sendBtn.disabled = false;
    updateSendButton();
  }
}

// ==================== サーバーデータの取得 ====================
async function loadServerData() {
  const serverUrl = getEffectiveServerUrl();

  if (!serverUrl) {
    setServerStatus('disconnected');
    serverTransactions = [];
    renderServerSummary();
    renderProductRanking();
    renderServerTxList([]);
    document.getElementById('server-tx-list').innerHTML = '<div class="text-center text-gray-400 py-4">サーバーURLが未設定です</div>';
    return;
  }

  document.getElementById('server-tx-list').innerHTML = '<div class="text-center text-gray-400 py-4">読み込み中...</div>';

  try {
    const res = await fetch(`${serverUrl}/api/transactions`);
    const data = await res.json();
    if (!data.ok) {
      setServerStatus('disconnected');
      serverTransactions = [];
      renderServerSummary();
      document.getElementById('server-tx-list').innerHTML = `<div class="text-center text-gray-400 py-4">エラー: ${escapeHtml(data.error || '不明なエラー')}</div>`;
      return;
    }
    setServerStatus('connected');
    serverTransactions = data.transactions || [];
    renderServerSummary();
    renderFilteredHistory();
  } catch(e) {
    console.warn('サーバーからのデータ取得に失敗しました:', e.message);
    setServerStatus('disconnected');
    serverTransactions = [];
    renderServerSummary();
    document.getElementById('server-tx-list').innerHTML = '<div class="text-center text-gray-400 py-4">サーバーに接続できませんでした</div>';
  }
}

// ==================== 売上集計パネル ====================
function renderServerSummary() {
  const el = document.getElementById('server-summary');
  const totalRevenue = serverTransactions.reduce((s, t) => s + (t.total || 0), 0);
  const count = serverTransactions.length;
  const totalItems = serverTransactions.reduce((s, t) => s + (t.items || []).reduce((is, i) => is + (i.数量 || 0), 0), 0);
  const lastTimestamp = count > 0 ? serverTransactions[0].timestamp : '─';
  el.innerHTML = `
    <div class="flex justify-between"><span class="text-gray-500">総売上</span><span class="font-bold text-green-600">¥${totalRevenue.toLocaleString()}</span></div>
    <div class="flex justify-between"><span class="text-gray-500">取引件数</span><span class="font-bold text-gray-800">${count}件</span></div>
    <div class="flex justify-between"><span class="text-gray-500">総販売数</span><span class="font-bold text-gray-800">${totalItems}個</span></div>
    <div class="flex justify-between"><span class="text-gray-500">最終取引</span><span class="font-bold text-gray-800">${lastTimestamp}</span></div>
  `;
}

// ==================== 各商品の販売数パネル ====================
// 商品名+種類の組み合わせ単位で別々に集計する(例:「かき氷（いちご）」「かき氷（メロン）」は別行)
function getProductRankingData() {
  const map = new Map();
  serverTransactions.forEach(t => {
    (t.items || []).forEach(i => {
      const key = `${i.商品名}__${i.種類 || ''}`;
      if (!map.has(key)) map.set(key, { 商品名: i.商品名, 種類: i.種類 || null, 数量: 0, 金額: 0 });
      const rec = map.get(key);
      rec.数量 += (i.数量 || 0);
      rec.金額 += (i.値段 || 0) * (i.数量 || 0);
    });
  });
  return Array.from(map.values());
}

function renderProductRanking() {
  const sortMode = document.getElementById('ranking-sort').value;
  const list = getProductRankingData();
  switch(sortMode) {
    case 'qty': list.sort((a, b) => b.数量 - a.数量); break;
    case 'amount': list.sort((a, b) => b.金額 - a.金額); break;
    case 'az': list.sort((a, b) => a.商品名.localeCompare(b.商品名, 'ja')); break;
    case 'za': list.sort((a, b) => b.商品名.localeCompare(a.商品名, 'ja')); break;
    default: break; // デフォルトは登場順(取引データに商品idが含まれないため、id順は再現できません)
  }
  const el = document.getElementById('product-ranking-list');
  if (!list.length) { el.innerHTML = '<div class="text-gray-400">データなし</div>'; return; }
  el.innerHTML = list.map(r => `
    <div class="flex justify-between items-center">
      <span class="text-gray-700">${escapeHtml(r.商品名)}${r.種類 ? `<span class="text-gray-400">（${escapeHtml(r.種類)}）</span>` : ''} <span class="text-gray-400">×${r.数量}</span></span>
      <span class="font-bold">¥${r.金額.toLocaleString()}</span>
    </div>
  `).join('');
}

// ==================== 検索(絞り込み)パネル ====================
function renderSearchDateTags() {
  const el = document.getElementById('search-date-tags');
  el.innerHTML = searchFilter.dates.map(d => `
    <span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-xs font-bold px-2 py-1 rounded-full">
      ${d}
      <button type="button" data-date="${d}" class="search-date-remove">×</button>
    </span>
  `).join('');
  el.querySelectorAll('.search-date-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      searchFilter.dates = searchFilter.dates.filter(d => d !== btn.dataset.date);
      renderSearchDateTags();
    });
  });
}

// タイムスタンプは new Date().toLocaleString('ja-JP') 形式の文字列で保存されているため、
// Dateとして再度パースして日付・時刻を取り出す(パースできない場合はフィルタ対象にしない)
function transactionMatchesFilter(t) {
  if (searchFilter.device && t.deviceName !== searchFilter.device) return false;
  if (!searchFilter.dates.length && !searchFilter.timeFrom && !searchFilter.timeTo) return true;

  const dt = new Date(t.timestamp);
  if (isNaN(dt.getTime())) return true;

  if (searchFilter.dates.length) {
    const y = dt.getFullYear(), m = String(dt.getMonth() + 1).padStart(2, '0'), d = String(dt.getDate()).padStart(2, '0');
    if (!searchFilter.dates.includes(`${y}-${m}-${d}`)) return false;
  }

  if (searchFilter.timeFrom || searchFilter.timeTo) {
    let startMinutes, endMinutes;
    if (searchFilter.timeFrom && searchFilter.timeTo) {
      // 範囲指定(例: 10:30〜17:00)
      const [fh, fm] = searchFilter.timeFrom.split(':').map(Number);
      const [th, tm] = searchFilter.timeTo.split(':').map(Number);
      startMinutes = fh * 60 + fm;
      endMinutes = th * 60 + tm;
    } else if (searchFilter.timeFrom) {
      // 開始時刻のみ指定 → その時間帯(hh:00〜hh:59)全体
      const [fh] = searchFilter.timeFrom.split(':').map(Number);
      startMinutes = fh * 60;
      endMinutes = fh * 60 + 59;
    } else {
      // 終了時刻のみ指定 → その時間帯(hh:00〜hh:59)全体
      const [th] = searchFilter.timeTo.split(':').map(Number);
      startMinutes = th * 60;
      endMinutes = th * 60 + 59;
    }
    const curMinutes = dt.getHours() * 60 + dt.getMinutes();
    if (startMinutes <= endMinutes) {
      // 通常の範囲(例: 10:00〜17:00)
      if (curMinutes < startMinutes || curMinutes > endMinutes) return false;
    } else {
      // 深夜跨ぎの範囲(例: 22:00〜翌2:00)。開始〜24時 または 0時〜終了、のどちらかに入っていればOK
      if (curMinutes > endMinutes && curMinutes < startMinutes) return false;
    }
  }

  return true;
}

function renderFilteredHistory() {
  renderServerTxList(serverTransactions.filter(transactionMatchesFilter));
}

// ==================== 取引履歴一覧(メイン表示) ====================
function renderServerTxList(transactions) {
  const listEl = document.getElementById('server-tx-list');
  if (!transactions.length) {
    listEl.innerHTML = '<div class="text-center text-gray-400 py-8">該当する取引データがありません</div>';
    return;
  }
  listEl.innerHTML = transactions.map(t => {
    const itemsHtml = (t.items || []).map(i => `${escapeHtml(i.商品名)}${i.種類 ? `（${escapeHtml(i.種類)}）` : ''} ×${i.数量}`).join(' / ');
    return `
      <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
        <div class="text-xs text-gray-400 mb-1">${escapeHtml(t.deviceName || '不明な端末')}</div>
        <div class="flex justify-between items-center mb-1">
          <span class="text-blue-600 font-bold">受付番号: ${t.orderNumber}</span>
          <span class="font-bold text-lg">¥${(t.total || 0).toLocaleString()}</span>
        </div>
        <div class="text-xs text-gray-400 mb-2">${escapeHtml(t.timestamp)}</div>
        <div class="text-sm text-gray-700 mb-2">${itemsHtml}</div>
        <div class="text-right text-xs text-gray-500 border-t border-gray-200 pt-2 mt-2">預り: ¥${(t.tender || 0).toLocaleString()} / おつり: ¥${(t.change || 0).toLocaleString()}</div>
      </div>
    `;
  }).join('');
}


// ==================== イベントリスナー設定 ====================
function setupEvents() {
  // 画面1 → 画面2（会計へ）
  document.getElementById('checkout-button').addEventListener('click', () => {
    const total = getCartTotal();
    if (!cartSequence.length) { alert('カートに商品がありません'); return; }
    currentTenderAmount = 0;
    document.getElementById('payment-due').textContent = `¥${total}`;
    document.getElementById('amount-tendered-display').textContent = '¥0';
    document.getElementById('change-due-display').textContent = '¥0';
    document.getElementById('change-due-display').className = 'text-5xl font-bold text-green-500';
    // 前回の会計確定でdisabledにした分を、未入力状態(0円預り=不足)に戻す
    const confirmBtn = document.getElementById('calculate-change-button');
    confirmBtn.disabled = true;
    confirmBtn.className = 'w-full max-w-xs mt-6 bg-gray-400 text-white font-bold py-4 rounded-xl text-xl shadow-lg transition';
    showScreen('screen2_pay');
    playSound('navigate');
  });

  // 画面2 → 画面1（戻る）
  document.getElementById('back-from-payment').addEventListener('click', () => {
    showScreen('screen1_order');
    playSound('navigate');
  });

  // テンキー
  document.querySelectorAll('.keypad-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      appendTenderDigit(btn.textContent.trim());
      playSound('click');
    });
  });

  document.getElementById('backspace-keypad').addEventListener('click', () => {
    currentTenderAmount = Math.floor(currentTenderAmount / 10);
    updatePaymentDisplay();
    playSound('remove');
  });

  document.getElementById('clear-keypad').addEventListener('click', () => {
    currentTenderAmount = 0;
    updatePaymentDisplay();
    playSound('clear');
  });

  // 会計確定
  document.getElementById('calculate-change-button').addEventListener('click', async () => {
    const confirmBtn = document.getElementById('calculate-change-button');
    if (confirmBtn.disabled) return; // 連打・多重クリック対策
    const due = parseInt(document.getElementById('payment-due').textContent.replace('¥', '')) || 0;
    const change = currentTenderAmount - due;
    if (change < 0) { alert('お預かり金額が不足しています'); return; }

    // ここで即座に無効化。移動後(次の会計へ)に画面2を開き直すタイミングで再度有効化する
    confirmBtn.disabled = true;

    const items = cartSequence.map(k => ({ 商品名: cart[k].商品名, 値段: cart[k].値段, 数量: cart[k].数量, 種類: cart[k].種類 || null }));
    const baseData = {
      items,
      total: due,
      tender: currentTenderAmount,
      change,
      timestamp: new Date().toLocaleString('ja-JP')
    };

    // DB保存はここで確定させる。失敗した場合はposHistoryにも一切触れず、
    // 「保存できたのに画面上だけ表示された」という食い違いが起きないようにする。
    let transaction;
    try {
      transaction = await saveTransaction(baseData);
    } catch(e) {
      console.error('会計データの保存に失敗しました:', e);
      alert('会計データの保存に失敗しました。もう一度お試しください。');
      confirmBtn.disabled = false;
      return;
    }

    posHistory.push(transaction);

    // 画面3表示
    document.getElementById('final-order-number').textContent = transaction.orderNumber;
    document.getElementById('final-change-amount').textContent = `¥${change}`;
    const breakdown = calcChange(change);
    document.getElementById('change-breakdown').innerHTML = breakdown.length
      ? breakdown.map(b => `<div class="flex justify-between"><span>¥${b.bill}</span><span>${b.count}枚</span></div>`).join('')
      : '<div class="text-gray-400">おつりなし</div>';
    document.getElementById('final-order-summary').innerHTML = items
      .map(i => `<div class="flex justify-between"><span>${escapeHtml(i.商品名)}${i.種類 ? `（${escapeHtml(i.種類)}）` : ''} ×${i.数量}</span><span>¥${i.値段 * i.数量}</span></div>`)
      .join('');

    // カートリセット
    cart = {}; cartSequence = []; selectedCartKey = null;
    updateCartView();

    showScreen('screen3_receipt');
    playSound('confirm');
  });

  // 画面3 → 画面1（次の会計へ）
  document.getElementById('new-transaction-button').addEventListener('click', () => {
    showScreen('screen1_order');
    playSound('navigate');
  });

  // 画面1 → 画面4（取引履歴）
  document.getElementById('btn-to-history').addEventListener('click', () => {
    renderHistorySummary();
    renderHistoryList();
    showScreen('screen4_history');
    playSound('navigate');
  });

  // 画面4 → 画面1（戻る）
  document.getElementById('back-from-history').addEventListener('click', () => {
    showScreen('screen1_order');
    playSound('navigate');
  });

  // 履歴検索
  document.getElementById('history-search-input').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    if (!q) { renderHistoryList(); return; }
    renderHistoryList(posHistory.filter(t => String(t.orderNumber).includes(q)));
  });

  // 履歴クリア
  document.getElementById('clear-history-button').addEventListener('click', () => {
    showClearHistoryConfirm();
  });

  // レジ1 → 画面6（サーバー連携）
  document.getElementById('btn-to-server').addEventListener('click', async () => {
    showScreen('screen6_server');
    playSound('navigate');
    // 前回選択したレジ番号を引き継ぐ(次に変更するまで保持される)
    selectedDevice = (await settingsGet('lastSelectedDevice')) || null;
    document.getElementById('device-select').value = selectedDevice || '';
    updateSendButton();
    hideServerStatus();
    closeAllAccordionPanels();
    await loadServerData();
  });

  // 画面6 → 画面1（戻る）
  document.getElementById('back-from-server').addEventListener('click', () => {
    showScreen('screen1_order');
    playSound('navigate');
  });

  // データ送信タブ: 端末選択(選んだ番号は次に変更するまで引き継がれる)
  document.getElementById('device-select').addEventListener('change', async (e) => {
    selectedDevice = e.target.value || null;
    await settingsSet('lastSelectedDevice', selectedDevice);
    updateSendButton();
    playSound('click');
  });

  // 送信ボタン
  document.getElementById('send-btn').addEventListener('click', handleSend);

  // 取引履歴の再読み込み
  document.getElementById('server-reload-btn').addEventListener('click', () => {
    playSound('navigate');
    loadServerData();
  });

  // 各商品の販売数タブ: 表示方法の切り替え
  document.getElementById('ranking-sort').addEventListener('change', renderProductRanking);

  // 検索タブ: 日付の追加
  document.getElementById('search-date-add-btn').addEventListener('click', () => {
    const val = document.getElementById('search-date-input').value;
    if (!val) return;
    if (!searchFilter.dates.includes(val)) searchFilter.dates.push(val);
    renderSearchDateTags();
    playSound('add');
  });

  // 検索タブ: 絞り込み実行
  document.getElementById('search-apply-btn').addEventListener('click', () => {
    searchFilter.timeFrom = document.getElementById('search-time-from').value;
    searchFilter.timeTo = document.getElementById('search-time-to').value;
    searchFilter.device = document.getElementById('search-device-select').value;
    renderFilteredHistory();
    playSound('confirm');
  });

  // 検索タブ: 条件クリア
  document.getElementById('search-clear-btn').addEventListener('click', () => {
    searchFilter = { dates: [], timeFrom: '', timeTo: '', device: '' };
    document.getElementById('search-time-from').value = '';
    document.getElementById('search-time-to').value = '';
    document.getElementById('search-device-select').value = '';
    renderSearchDateTags();
    renderFilteredHistory();
    playSound('clear');
  });

  // 画面1 → 画面5（商品管理）
  document.getElementById('btn-to-manager').addEventListener('click', () => {
    renderProductManagementList();
    showScreen('screen5_manage');
    playSound('navigate');
  });

  // 画面5 → 画面1（戻る）
  document.getElementById('back-from-manager').addEventListener('click', () => {
    showScreen('screen1_order');
    playSound('navigate');
  });

  // 商品追加
  document.getElementById('add-product-btn').addEventListener('click', async () => {
    const nameEl = document.getElementById('new-product-name');
    const typeEl = document.getElementById('new-product-type');
    const priceEl = document.getElementById('new-product-price');
    const name = nameEl.value.trim();
    const type = typeEl.value.trim();
    const price = Number(priceEl.value);
    if (!isValidProductName(name)) { alert('商品名には文字を1文字以上含めてください(記号・数字だけは登録できません)'); return; }
    if (!isValidPrice(price)) { alert('価格は1以上の整数で入力してください'); return; }
    const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
    const newProduct = { id: newId, '商品名': name, '値段': price };
    if (type) newProduct['種類'] = type;
    products.push(newProduct);
    await saveProducts();
    nameEl.value = ''; typeEl.value = ''; priceEl.value = '';
    renderProductManagementList();
    renderProducts();
    playSound('add');
  });

  // カートの選択商品を削除
  document.getElementById('remove-selected-btn').addEventListener('click', () => {
    if (!selectedCartKey) return;
    removeFromCart(selectedCartKey);
    if (!cart[selectedCartKey]) selectedCartKey = null;
    updateCartView();
    playSound('remove');
  });

}

// お預かり金額にキー入力を1桁追加する(テンキー・物理キーボード共通)。10桁を超える入力は無視する。
function appendTenderDigit(digit) {
  const next = (currentTenderAmount === 0) ? digit : String(currentTenderAmount) + digit;
  if (next.replace(/^0+(?=\d)/, '').length > MAX_TENDER_DIGITS) return; // 上限を超える入力は無視
  currentTenderAmount = parseInt(next) || 0;
  updatePaymentDisplay();
}

// ==================== 物理キーボード対応(お支払い画面のテンキー) ====================
document.addEventListener('keydown', (e) => {
  const screen2 = document.getElementById('screen2_pay');
  if (!screen2.classList.contains('active')) return; // お支払い画面以外では無視

  if (e.key >= '0' && e.key <= '9') {
    appendTenderDigit(e.key);
    playSound('click');
  } else if (e.key === 'Backspace') {
    currentTenderAmount = Math.floor(currentTenderAmount / 10);
    updatePaymentDisplay();
    playSound('remove');
  } else if (e.key === 'Escape') {
    currentTenderAmount = 0;
    updatePaymentDisplay();
    playSound('clear');
  } else if (e.key === 'Enter') {
    const confirmBtn = document.getElementById('calculate-change-button');
    if (!confirmBtn.disabled) confirmBtn.click();
  }
});

function updatePaymentDisplay() {
  const due = parseInt(document.getElementById('payment-due').textContent.replace('¥', '')) || 0;
  const change = currentTenderAmount - due;
  document.getElementById('amount-tendered-display').textContent = `¥${currentTenderAmount}`;
  const changeEl = document.getElementById('change-due-display');
  const confirmBtn = document.getElementById('calculate-change-button');
  if (change >= 0) {
    changeEl.textContent = `¥${change}`;
    changeEl.className = 'text-5xl font-bold text-green-500';
    confirmBtn.disabled = false;
    confirmBtn.className = 'w-full max-w-xs mt-6 bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl text-xl shadow-lg active:scale-95 transition';
  } else {
    changeEl.textContent = `¥${Math.abs(change)}`;
    changeEl.className = 'text-5xl font-bold text-red-500';
    confirmBtn.disabled = true;
    confirmBtn.className = 'w-full max-w-xs mt-6 bg-gray-400 text-white font-bold py-4 rounded-xl text-xl shadow-lg transition';
  }
}

// ==================== Service Worker ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      console.log('✅ Service Worker registered');
    }).catch(err => {
      console.warn('⚠️ SW registration failed:', err);
    });
  });
}

// ==================== 起動 ====================
async function startApp() {
  try {
    await db.open();
    await initServerSettings();
    await loadHistory();
    await loadProductsFromYAML();
  } catch(e) {
    console.error('Startup error:', e);
  }
  renderProducts();
  updateCartView();
  setupEvents();
  setupAccordionTabs();
}

document.addEventListener('DOMContentLoaded', startApp);

})();
</script>
